name: Profile stats

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/render_stats.py "${{ github.repository_owner }}" assets

      - name: Commit changes
        run: |
          git add assets/stats-*.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update stats cards"
          git push
